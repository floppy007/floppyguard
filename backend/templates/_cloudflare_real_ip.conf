{% if meta.cloudflare_dns.enabled == true and meta.cloudflare_dns.proxied == true %}{% assign fg_cf_proxied = true %}{% endif %}{% if meta.cloudflareDns.enabled == true and meta.cloudflareDns.proxied == true %}{% assign fg_cf_proxied = true %}{% endif %}{% if fg_cf_proxied %}
  # Cloudflare-Proxy (FloppyGuard): echte Besucher-IP nur aus CF-Connecting-IP und nur von Cloudflare-Adressen,
  # damit Länder-Filter, Zugriffslisten und Logs den Besucher sehen statt des Cloudflare-Knotens
  include conf.d/include/ip_ranges_cloudflare[.]conf;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
{% endif %}
