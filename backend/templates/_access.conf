{% if access_list_id > 0 %}
    {% if access_list.items.length > 0 %}
    # Authorization
    auth_basic            "Authorization required";
    auth_basic_user_file  /data/access/{{ access_list_id }};

    {% if access_list.pass_auth == 0 or access_list.pass_auth == false %}
    proxy_set_header Authorization "";
    {% endif %}

    {% endif %}

    {% comment %}
    Users but no client rules: no "deny all", the users alone decide (with
    "satisfy all" a "deny all" without any "allow" rejected valid logins too).
    Every other case keeps "deny all": an access list with neither users nor
    rules (or relations that were not loaded) stays closed, never open.
    {% endcomment %}
    {% if access_list.items.length > 0 and access_list.clients.length == 0 %}
    # Access Rules: none, Basic Auth only
    {% else %}
    # Access Rules: {{ access_list.clients | size }} total
    {% for client in access_list.clients %}
    {{client | nginxAccessRule}}
    {% endfor %}
    deny all;
    {% endif %}

    # Access checks must...
    {% if access_list.satisfy_any == 1 or access_list.satisfy_any == true %}
    satisfy any;
    {% else %}
    satisfy all;
    {% endif %}
{% endif %}
